<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cosmic Pairing Compatibility</title>
  <style>
    :root{--bg:#0f1220;--card:#181c31;--text:#ebefff;--muted:#a6b0d9;--accent:#7f8cff;--good:#2ecc71;--warn:#f39c12;--bad:#e74c3c}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#1c2242,#0f1220 50%);color:var(--text);font-family:Inter,system-ui,sans-serif}
    .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card{background:var(--card);border:1px solid #2a3158;border-radius:14px;padding:16px}
    h1,h2,h3{margin:0 0 10px} p{color:var(--muted)} label{font-size:.9rem;color:#cfd6fb}
    input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #394271;background:#111632;color:var(--text)}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{background:var(--accent);color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
    .result{display:none}
    .score{font-size:52px;font-weight:900}.muted{color:var(--muted)}
    table{width:100%;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid #2c355f;text-align:left}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#212851;color:#d8ddff;font-size:.8rem;margin-right:6px}
    @media (max-width:900px){.grid,.fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Compatibility Pairing App</h1>
  <p>Ephemeral in-browser calculation for numerology + Chinese zodiac + optional Western synastry proxy.</p>

  <div class="card" style="margin-bottom:16px">
    <label><input type="checkbox" id="consent" /> I confirm both people gave mutual consent for profile comparison.</label>
  </div>

  <div class="grid">
    <section class="card">
      <h2>Person A</h2>
      <div class="fields">
        <div><label>Full Name</label><input id="a_name" required></div>
        <div><label>Gender (optional)</label><input id="a_gender"></div>
        <div><label>Birth Date</label><input id="a_date" type="date" required></div>
        <div><label>Birth Time</label><input id="a_time" type="time" required></div>
        <div><label>Birthplace (city/country)</label><input id="a_place" required></div>
        <div><label>Timezone (optional)</label><input id="a_tz" placeholder="e.g. UTC+1"></div>
      </div>
    </section>
    <section class="card">
      <h2>Person B</h2>
      <div class="fields">
        <div><label>Full Name</label><input id="b_name" required></div>
        <div><label>Gender (optional)</label><input id="b_gender"></div>
        <div><label>Birth Date</label><input id="b_date" type="date" required></div>
        <div><label>Birth Time</label><input id="b_time" type="time" required></div>
        <div><label>Birthplace (city/country)</label><input id="b_place" required></div>
        <div><label>Timezone (optional)</label><input id="b_tz" placeholder="e.g. UTC+1"></div>
      </div>
    </section>
  </div>

  <div style="margin:16px 0"><button onclick="runCompare()">Compute Compatibility</button></div>

  <section id="result" class="card result">
    <h2>Result</h2>
    <div class="score" id="score"></div>
    <p id="label"></p>
    <div id="insights"></div>
    <h3>Metric Breakdown</h3>
    <table><thead><tr><th>Metric</th><th>Weight</th><th>Signal</th><th>Points</th></tr></thead><tbody id="rows"></tbody></table>
  </section>
</div>
<script>
const letterMap = {A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8};
const vowels = new Set(['A','E','I','O','U']);
const chinese = ['Rat','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Goat','Monkey','Rooster','Dog','Pig'];
const clashes = {Rat:'Horse',Ox:'Goat',Tiger:'Monkey',Rabbit:'Rooster',Dragon:'Dog',Snake:'Pig',Horse:'Rat',Goat:'Ox',Monkey:'Tiger',Rooster:'Rabbit',Dog:'Dragon',Pig:'Snake'};
const trines = [['Rat','Dragon','Monkey'],['Ox','Snake','Rooster'],['Tiger','Horse','Dog'],['Rabbit','Goat','Pig']];
const complements = new Set(['1-5','5-1','2-6','6-2','3-9','9-3','4-8','8-4']);
const weights = {life:30,expr:20,soul:15,personality:10,chinese:15,western:10};

function reduceNum(n){ while(n>9 && ![11,22,33].includes(n)){ n = String(n).split('').reduce((a,b)=>a+ +b,0);} return n; }
function sumDigits(s){ return s.replace(/\D/g,'').split('').reduce((a,b)=>a+ +b,0); }
function birthDay(date){ return reduceNum(+date.split('-')[2]); }
function lifePath(date){ return reduceNum(sumDigits(date)); }
function nameNums(name){
  const chars = name.toUpperCase().replace(/[^A-Z]/g,'').split('');
  const total = chars.reduce((a,c)=>a+(letterMap[c]||0),0);
  const soul = chars.filter(c=>vowels.has(c)).reduce((a,c)=>a+(letterMap[c]||0),0);
  const pers = chars.filter(c=>!vowels.has(c)).reduce((a,c)=>a+(letterMap[c]||0),0);
  return {expression:reduceNum(total), soul:reduceNum(soul), personality:reduceNum(pers)};
}
function personalYear(date){ const y = new Date().getFullYear(); return reduceNum(sumDigits(date.slice(5)) + sumDigits(String(y))); }
function westernSun(date){
  const [y,m,d]=date.split('-').map(Number);
  const z=[['Capricorn',1,19],['Aquarius',2,18],['Pisces',3,20],['Aries',4,19],['Taurus',5,20],['Gemini',6,20],['Cancer',7,22],['Leo',8,22],['Virgo',9,22],['Libra',10,22],['Scorpio',11,21],['Sagittarius',12,21],['Capricorn',12,31]];
  for(const [name,mm,dd] of z){ if((m===mm && d<=dd) || (m===12&&d>21)) return name; }
  return 'Capricorn';
}
function chineseSign(year){ return chinese[(year-4)%12]; }
function chineseElement(year){ const e=['Wood','Wood','Fire','Fire','Earth','Earth','Metal','Metal','Water','Water']; return e[(year-4)%10]; }
function signal(a,b){ if(a===b) return 1; if(complements.has(`${a}-${b}`)) return 1; return 0; }

function buildPerson(prefix){
  const name=document.getElementById(prefix+'_name').value.trim();
  const date=document.getElementById(prefix+'_date').value;
  const time=document.getElementById(prefix+'_time').value;
  const place=document.getElementById(prefix+'_place').value.trim();
  if(!name||!date||!time||!place) throw new Error(`Missing required fields for ${prefix.toUpperCase()}`);
  const n=nameNums(name); const year=+date.slice(0,4);
  const karmic=[13,14,16,19].filter(k=>sumDigits(date+name)===k);
  return {name,date,time,place, life:lifePath(date), ...n, birth:birthDay(date), py:personalYear(date),
    chinese:chineseSign(year), element:chineseElement(year), sun:westernSun(date), masters:[11,22,33].filter(v=>[lifePath(date),n.expression,n.soul,n.personality].includes(v)), karmic};
}
function westernSignal(a,b){ // proxy without ephemeris: sign element affinity
  const fire=['Aries','Leo','Sagittarius'], earth=['Taurus','Virgo','Capricorn'], air=['Gemini','Libra','Aquarius'], water=['Cancer','Scorpio','Pisces'];
  const groups=[fire,earth,air,water];
  if(a.sun===b.sun) return 1;
  const ga=groups.find(g=>g.includes(a.sun)); const gb=groups.find(g=>g.includes(b.sun));
  return ga===gb ? 1 : 0;
}
function chineseSignal(a,b){
  if(a.chinese===b.chinese) return 1;
  if(clashes[a.chinese]===b.chinese) return -1;
  if(trines.some(t=>t.includes(a.chinese)&&t.includes(b.chinese))) return 1;
  return 0;
}
function runCompare(){
  if(!document.getElementById('consent').checked){ alert('Mutual consent is required.'); return; }
  try{
    const a=buildPerson('a'), b=buildPerson('b');
    const metrics=[
      ['Life Path',weights.life,signal(a.life,b.life),`${a.life} vs ${b.life}`],
      ['Expression',weights.expr,signal(a.expression,b.expression),`${a.expression} vs ${b.expression}`],
      ['Soul Urge',weights.soul,signal(a.soul,b.soul),`${a.soul} vs ${b.soul}`],
      ['Personality',weights.personality,signal(a.personality,b.personality),`${a.personality} vs ${b.personality}`],
      ['Chinese Zodiac',weights.chinese,chineseSignal(a,b),`${a.chinese}(${a.element}) vs ${b.chinese}(${b.element})`],
      ['Western Synastry (proxy)',weights.western,westernSignal(a,b),`${a.sun} vs ${b.sun}`]
    ];
    const totalWeight=metrics.reduce((s,m)=>s+m[1],0);
    const raw=metrics.reduce((s,[,w,sig])=>s+(w*sig),0);
    const score=((raw+totalWeight)/(2*totalWeight))*100;
    document.getElementById('result').style.display='block';
    document.getElementById('score').textContent=`${score.toFixed(1)}%`;
    document.getElementById('label').textContent=score>=80?'Great match':score>=60?'Strong potential':'Mixed compatibility';
    document.getElementById('rows').innerHTML=metrics.map(([m,w,sig,detail])=>`<tr><td>${m}<br><span class='muted'>${detail}</span></td><td>${w}%</td><td>${sig===1?'Positive':sig===-1?'Clash':'Neutral'}</td><td>${(w*sig).toFixed(1)}</td></tr>`).join('');
    document.getElementById('insights').innerHTML=`
      <p><span class='pill'>A Life Path ${a.life}</span><span class='pill'>B Life Path ${b.life}</span>
      ${a.life===b.life?'Shared core trajectory supports alignment.':'Different paths can be complementary with effort.'}</p>
      <p>Soul Urge ${a.soul} vs ${b.soul}: ${signal(a.soul,b.soul)===1?'emotionally aligned/complementary':'distinct emotional needs to negotiate'}.</p>
      <p>Chinese zodiac: ${a.chinese} & ${b.chinese}. ${chineseSignal(a,b)===1?'Harmony/trine present.':chineseSignal(a,b)===-1?'Direct clash axis detected — extra compromise helps.':'No major harmony/clash indicator.'}</p>
      <p>Master numbers detected: A [${a.masters.join(',')||'none'}], B [${b.masters.join(',')||'none'}]. Personal Year: A ${a.py}, B ${b.py}.</p>
      <p class='muted'>Privacy: calculations run client-side and are not persisted by default in this demo.</p>`;
  }catch(e){ alert(e.message); }
}
</script>
</body>
</html>
